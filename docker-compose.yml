# Uruchomienie: docker compose up -d --build
# Potem: http://localhost:8000 (hasło pierwszego admina w logu - docker compose logs asi)
#
# network_mode: host wymaga Linuksa (natywny Docker Engine) - tylko wtedy kontener widzi
# realną sieć hosta tak, jak potrzebuje do SYN scan / odkrywania sieci LAN. Na Docker Desktop
# (Windows/Mac) usuń network_mode: host i odkomentuj "ports" niżej - skanowanie będzie
# ograniczone do tego, co widać z wirtualnej maszyny Docker Desktop.
services:
  asi:
    build:
      context: .
      args:
        ASI_VERSION: "${ASI_VERSION:-dev}"
    # Wycofanie zmian: obrazy są tagowane wersją. Powrót do poprzedniej:
    #   ASI_VERSION=<poprzednia> docker compose up -d   (przed aktualizacją zrób kopię wolumenu asi-data - patrz README)
    image: "attack-surface-intelligence:${ASI_VERSION:-latest}"
    container_name: ${ASI_CONTAINER_NAME:-asi}
    network_mode: host
    # ports:
    #   - "8000:8000"
    cap_drop: ["ALL"]
    cap_add: ["NET_RAW"]  # wymagane do SYN scan (naabu/nmap) - NET_ADMIN nie jest do tego potrzebne
    restart: unless-stopped
    volumes:
      - asi-data:/data
      - asi-nuclei-templates:/root/nuclei-templates
    environment:
      PYTHONUNBUFFERED: "1"
      ASI_ALLOWED_TARGETS: "${ASI_ALLOWED_TARGETS:-}"
      ASI_ALLOW_PRIVATE: "${ASI_ALLOW_PRIVATE:-}"
      ASI_MAX_TARGETS: "${ASI_MAX_TARGETS:-20000}"
      ASI_MAX_WORKERS: "${ASI_MAX_WORKERS:-4}"
      ASI_SCAN_RATE: "${ASI_SCAN_RATE:-300}"
      ASI_NMAP_INTRUSIVE: "${ASI_NMAP_INTRUSIVE:-}"  # 1 = admin może użyć skryptów NSE brute/exploit/dos/fuzzer
      ASI_NMAP_TIMEOUT: "${ASI_NMAP_TIMEOUT:-14400}"
      ASI_COOKIE_SECURE: "${ASI_COOKIE_SECURE:-0}"
      ASI_DEFECTDOJO_URL: "${ASI_DEFECTDOJO_URL:-}"
      ASI_DEFECTDOJO_API_KEY: "${ASI_DEFECTDOJO_API_KEY:-}"
      ASI_GVM_HOST: "${ASI_GVM_HOST:-}"
      ASI_GVM_PASSWORD: "${ASI_GVM_PASSWORD:-}"
      ASI_SCHEDULER: "${ASI_SCHEDULER:-1}"  # 0 = wyłącz automatyczne skany (np. awaryjnie)
      ASI_WEBHOOK_URL: "${ASI_WEBHOOK_URL:-}"  # powiadomienia o alertach (Slack/Mattermost/Teams incoming webhook)
      # Wywiad zewnętrzny (Shodan/NVD/Censys) wysyła publiczne adresy skanowanych celów do osób trzecich - domyślnie wyłączony
      ASI_EXTERNAL_INTEL: "${ASI_EXTERNAL_INTEL:-}"

volumes:
  asi-data:
  asi-nuclei-templates:
