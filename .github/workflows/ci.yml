name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check asi tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Zbudowany frontend w static/ jest aktualny
        run: |
          git add -N static
          git diff --exit-code --stat -- static || { echo "::error::static/ nie odpowiada frontend/src - uruchom 'npm run build' i zacommituj"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg WITH_TOOLS=0 -t asi:ci .
      - name: Kontener startuje i odpowiada na /api/health
        run: |
          docker run -d --name asi -p 8000:8000 asi:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs asi; exit 1
